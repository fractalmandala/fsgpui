[package]
name = "fsgpui-diff"
version = "0.1.0"
edition = "2024"
description = "Git diff parsing, syntax highlighting, and GPUI hunk review surface (fsgpui)"
license = "GPL-3.0-only"

[lib]
path = "src/lib.rs"

[dependencies]
gpui = { workspace = true }
uuid = { version = "1.18", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
